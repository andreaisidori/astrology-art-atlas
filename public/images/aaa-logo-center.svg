<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#e8bf72"/>
      <stop offset="70%" stop-color="#cf9845"/>
      <stop offset="100%" stop-color="#f5d58d"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5b869" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#e5b869" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="centerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="0" cy="0" r="300" fill="url(#centerAura)"/>
  <circle cx="0" cy="0" r="290" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4,8" fill="none" opacity="0.5"/>
  <circle cx="0" cy="0" r="275" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.75"/>

  <g id="aaa-monogram" filter="url(#centerGlow)">
    <line x1="0" y1="-260" x2="0" y2="260" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25"/>
    <line x1="-260" y1="0" x2="260" y2="0" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25"/>
    <circle cx="0" cy="0" r="160" stroke="url(#goldGrad)" stroke-width="0.6" stroke-dasharray="2,6" fill="none" opacity="0.25"/>

    <!-- Classical Roman Architectural Astrolabe "A A A" Triple Monogram -->
    <!-- Left A -->
    <g transform="translate(-112, 5) scale(0.88)">
      <path d="M -58 68 L -8 -72 L 0 -72 L -44 68 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <path d="M 0 -72 L 8 -72 L 58 68 L 44 68 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="-34" y="16" width="68" height="7" rx="2" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="-68" y="64" width="28" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="40" y="64" width="28" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
      <polygon points="-12,-72 12,-72 0,-82" fill="url(#goldGrad)" opacity="0.85"/>
    </g>

    <!-- Right A -->
    <g transform="translate(112, 5) scale(0.88)">
      <path d="M -58 68 L -8 -72 L 0 -72 L -44 68 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <path d="M 0 -72 L 8 -72 L 58 68 L 44 68 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="-34" y="16" width="68" height="7" rx="2" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="-68" y="64" width="28" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
      <rect x="40" y="64" width="28" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
      <polygon points="-12,-72 12,-72 0,-82" fill="url(#goldGrad)" opacity="0.85"/>
    </g>

    <!-- Center Majestic A (Dominant, elevated) -->
    <g transform="translate(0, -10) scale(1.18)">
      <path d="M -60 68 L -9 -74 L 0 -74 L -45 68 Z" fill="url(#goldGrad)"/>
      <path d="M 0 -74 L 9 -74 L 60 68 L 45 68 Z" fill="url(#goldGrad)"/>
      <rect x="-35" y="16" width="70" height="8" rx="2" fill="url(#goldGrad)"/>
      <rect x="-70" y="64" width="30" height="5.5" rx="1" fill="url(#goldGrad)"/>
      <rect x="40" y="64" width="30" height="5.5" rx="1" fill="url(#goldGrad)"/>
      <polygon points="-14,-74 14,-74 0,-85" fill="url(#goldGrad)"/>
    </g>
    
    <line x1="-180" y1="100" x2="180" y2="100" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>